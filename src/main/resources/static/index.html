<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARTA SHOP</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PortOne V2 Browser SDK -->
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>

  <!-- ── 헤더 / 네비게이션 ── -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo"><span class="logo-s">S</span>PARTA SHOP</a>
      <nav class="nav-links">
        <div class="nav-dropdown-wrap">
          <a href="#/" class="nav-link" data-page="/">상품 ▾</a>
          <div class="nav-dropdown">
            <a class="nav-dd-item" onclick="renderProducts(0,'')">전체 상품</a>
            <a class="nav-dd-item" onclick="renderProducts(0,'CLOTHES')">의류</a>
            <a class="nav-dd-item" onclick="renderProducts(0,'FOOD')">식품</a>
            <a class="nav-dd-item" onclick="renderProducts(0,'ELECTRONICS')">전자제품</a>
          </div>
        </div>
        <a href="#/cart"   class="nav-link" data-page="/cart">
          장바구니&nbsp;<span id="cart-badge" class="badge" style="display:none">0</span>
        </a>
        <a href="#/orders" class="nav-link" data-page="/orders">주문내역</a>
        <a href="#/points" class="nav-link" data-page="/points">포인트</a>
      </nav>
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </header>

  <!-- ── 페이지 콘텐츠 (SPA 렌더링 영역) ── -->
  <main id="app" class="main-content"></main>

  <!-- ── 토스트 알림 ── -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ── 모달 오버레이 ── -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- ── Scripts ── -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
